
name: Build Apexo for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Create local Sentry configuration
        shell: pwsh
        run: |
          Set-Content -Path lib/sentry_dsn.dart -Value "const String sentryDSN = '';" -Encoding utf8

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: apexo-windows-exe
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Package MSIX
        shell: pwsh
        run: |
          ./tools/patch_msix_manifest.ps1 -SkipFlutterBuild

      - name: Upload MSIX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexo-windows-msix
          path: build/windows/x64/runner/Release/apexo.msix
          if-no-files-found: warn
